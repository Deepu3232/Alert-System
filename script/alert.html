                            if (alert.alertType === 'bestBidQty') {

                                        // console.log("BEST BID QUANTITY ALERT BREACHED !!!");

        //in icebergAlert, we have to start both TAS and L1 subscriptions
        function icebergAlert(icebergInstruments) {
            if (TASSubscription || L1Subscription) {
                TASClient.unsubscribe(TASSubscription);
                L1Client.unsubscribe(L1Subscription);
                // console.log("Unsubscribed from 'icebergAlertSubscription' subscription.");
            }

            if (icebergInstruments) {
                // console.log("here " , icebergInstruments)
                TASSubscription = new Subscription("DISTINCT", icebergInstruments, TAS_fields);
                L1Subscription = new Subscription("MERGE", icebergInstruments, L1_fields);


                TASSubscription.addListener({
                    onItemUpdate: function (update) {
                        let values = update.updateValues;
                        console.log("Iceberg TAS Values  ", values);
                        if (update.getValue("IsOtc") === "True") {
                            return;
                        }
                        if (update.getValue("IsImplied") === "True") {
                            return;
                        }
                        if (update.getValue("IsLegTrade") === "True") {
                            return;
                        }
                        if (update.getValue("Direction") === "Unknown") {
                            return;
                        }

                        const side = update.getValue("Direction");
                        const qty = parseInt(update.getValue("Qty"), 10);
                        const price = (Math.round(parseFloat(update.getValue("Price")) * 10000) / 10000).toFixed(4);
                        const ins = update.getValue("InstrumentId");

                        try {
                            if (!ice_dict[ins]) {
                                ice_dict[ins] = {};
                            }
                            if (!ice_dict[ins][price]) {
                                ice_dict[ins][price] = { Take: 0, Hit: 0 };
                            }
                            ice_dict[ins][price][side] += qty;
                        } catch (error) {
                            console.error('Error updating ice_dict:', error);
                        }

                        ltp_dict[ins] = price;
                        console.log("ltp_dict", ltp_dict)
                        console.log("ice_dict", ice_dict)
                    }
                })


                L1Subscription.addListener({
                    onItemUpdate: function (update) {
                        let values = update.updateValues;
                        console.log("Iceberg L1 Values ", values);

                        const bid_pr = parseFloat(update.getValue("BestBid")).toFixed(4);
                        const ask_pr = parseFloat(update.getValue("BestAsk")).toFixed(4);
                        const ins = update.getValue("InstrumentId");
                        const contr = update.getValue("Contract");
                        const status = update.getValue("SeriesStatus");
                        const bidq = parseInt(update.getValue("BestBidQty"), 10);
                        const askq = parseInt(update.getValue("BestAskQty"), 10);

                        if (status !== "Mktopen") {
                            ice_dict[ins] = {};
                            existing_ice[ins] = [];
                            return;
                        }

                        if (existing_ice[ins] && existing_ice[ins].length >= 2) {
                            return;
                        }

                        const ltp = parseFloat(ltp_dict[ins]);
                        const str_ltp = ltp.toFixed(4);

                        if (bid_pr < ltp && ltp < ask_pr) {
                            ice_dict[ins][str_ltp] = { Take: 0, Hit: 0 };
                        }
                        if (bid_pr === ltp && ltp < ask_pr) {
                            ice_dict[ins][str_ltp]["Take"] = 0;
                        }
                        if (bid_pr < ltp && ltp === ask_pr) {
                            ice_dict[ins][str_ltp]["Hit"] = 0;
                        }
                        console.log("Checking here")
                        //Check Alert Code
                        const ask_q = ice_dict[ins][str_ltp]["Take"];
                        const bid_q = ice_dict[ins][str_ltp]["Hit"];

                        if (ask_q >= thres) {
                            const check_ls = [str_ltp, "Sell"];
                            if (!existing_ice[ins] || !existing_ice[ins].some(item => item[0] === str_ltp && item[1] === "Sell")) {
                                existing_ice[ins].push(check_ls);
                                const ice = [contr, ...check_ls, ask_q, ins];
                                mail1(ice);
                            }
                        }

                        if (bid_q >= thres) {
                            const check_ls = [str_ltp, "Buy"];
                            if (!existing_ice[ins] || !existing_ice[ins].some(item => item[0] === str_ltp && item[1] === "Buy")) {
                                existing_ice[ins].push(check_ls);
                                const ice = [contr, ...check_ls, bid_q, ins];
                                mail1(ice);
                            }
                        }

                    }
                })

                TASSubscription.setDataAdapter("HGTAS_Adapter");
                TASSubscription.setRequestedSnapshot("no");
                TASClient.subscribe(TASSubscription);
                TASClient.connect();
                // console.log("Subscribed to new instruments.");


                L1Subscription.setDataAdapter("HGL1_Adapter");
                L1Subscription.setRequestedSnapshot("no");
                L1Subscription.setRequestedMaxFrequency(1);
                L1Client.subscribe(L1Subscription);
                L1Client.connect();
                // console.log("Subscribed to new instruments.");
            }
        }


        function init() {

                        let BestAskQty = parseFloat(values[5]);
                        let BestBidQty = parseFloat(values[7]);

                        alerts.forEach((alert) => {
                            //checking all the alerts here....
                            let alertType = alert["alertType"];
                            let threshold = parseFloat(alert["threshold"]);

                            if (alertType === "bestAskQty") {
                                let contracts = alert["details"];
                                let alertID = alert["_id"];
                                contracts.forEach((contract) => {
                                    if (contract.insID === insID && BestAskQty > threshold && contract.status === "active") {
                                        updateStatus(alertID, insID, contract.contractName, alertType, threshold, BestAskQty);
                                        console.log("Came INSIDE BEST ASK QUANTITY");
                                    }
                                });
                            } else if (alertType === "bestBidQty") {
                                let contracts = alert["details"];
                                let alertID = alert["_id"];
                                contracts.forEach((contract) => {
                                    if (contract.insID === insID && BestBidQty > threshold && contract.status === "active") {

                                        console.log("Came inside BEST BID QUANTITY");
                                    }
                                });
                            }
                        });
                    }
                });

                subscription.setDataAdapter("HGL1_Adapter");
                subscription.setRequestedSnapshot("no");
                subscription.setRequestedMaxFrequency(1);
                client.subscribe(subscription);
                client.connect();
                // console.log("Subscribed to new instruments.");
            }
        }
