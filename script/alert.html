                        let BestBidQty = parseFloat(values[7]);

                                // console.log("came here")
                                let contracts = alert["details"];
                                
                                // console.log(contracts)
                                let alertType = alert.alertType
                                let alertID = alert["_id"];
                                // console.log("ALERT ID INSIDE BEST BID QUANTITY ALERT", alertID);
                                // console.log("Camer HERE ")
                                contracts.forEach((contract) => {
                                    // console.log(contract)

                                        console.log("BEST BID QUANTITY ALERT BREACHED !!!");

                                        // sendMessage(contractName, alertType, threshold, BestBidQty , alert["user"]);

                                });

                bestBidQtyAlertSubscription.setRequestedSnapshot("no");
                bestBidQtyAlertSubscription.setRequestedMaxFrequency(1);
                client.subscribe(bestBidQtyAlertSubscription);

        //in icebergAlert, we have to start both TAS and L1 subscriptions
        function icebergAlert(icebergInstruments) {
            if (TASSubscription || L1Subscription) {
                TASClient.unsubscribe(TASSubscription);
                L1Client.unsubscribe(L1Subscription);
                // console.log("Unsubscribed from 'icebergAlertSubscription' subscription.");
            }

            if (icebergInstruments) {
                // console.log("here " , icebergInstruments)
                TASSubscription = new Subscription("DISTINCT", icebergInstruments, TAS_fields);
                L1Subscription = new Subscription("MERGE", icebergInstruments, L1_fields);


                TASSubscription.addListener({
                    onItemUpdate: function (update) {
                        let values = update.updateValues;
                        console.log("Iceberg TAS Values  ", values);
                        if (update.getValue("IsOtc") === "True") {
                            return;
                        }
                        if (update.getValue("IsImplied") === "True") {
                            return;
                        }
                        if (update.getValue("IsLegTrade") === "True") {
                            return;
                        }
                        if (update.getValue("Direction") === "Unknown") {
                            return;
                        }

                        const side = update.getValue("Direction");
                        const qty = parseInt(update.getValue("Qty"), 10);
                        const price = (Math.round(parseFloat(update.getValue("Price")) * 10000) / 10000).toFixed(4);
                        const ins = update.getValue("InstrumentId");

                        try {
                            if (!ice_dict[ins]) {
                                ice_dict[ins] = {};
                            }
                            if (!ice_dict[ins][price]) {
                                ice_dict[ins][price] = { Take: 0, Hit: 0 };
                            }
                            ice_dict[ins][price][side] += qty;
                        } catch (error) {
                            console.error('Error updating ice_dict:', error);
                        }

                        ltp_dict[ins] = price;
                        console.log("ltp_dict", ltp_dict)
                        console.log("ice_dict", ice_dict)
                    }
                })


                L1Subscription.addListener({
                    onItemUpdate: function (update) {
                        let values = update.updateValues;
                        console.log("Iceberg L1 Values ", values);

                        const bid_pr = parseFloat(update.getValue("BestBid")).toFixed(4);
                        const ask_pr = parseFloat(update.getValue("BestAsk")).toFixed(4);
                        const ins = update.getValue("InstrumentId");
                        const contr = update.getValue("Contract");
                        const status = update.getValue("SeriesStatus");
                        const bidq = parseInt(update.getValue("BestBidQty"), 10);
                        const askq = parseInt(update.getValue("BestAskQty"), 10);

                        if (status !== "Mktopen") {
                            ice_dict[ins] = {};
                            existing_ice[ins] = [];
                            return;
                        }

                        if (existing_ice[ins] && existing_ice[ins].length >= 2) {
                            return;
                        }

                        const ltp = parseFloat(ltp_dict[ins]);
                        const str_ltp = ltp.toFixed(4);

                        if (bid_pr < ltp && ltp < ask_pr) {
                            ice_dict[ins][str_ltp] = { Take: 0, Hit: 0 };
                        }
                        if (bid_pr === ltp && ltp < ask_pr) {
                            ice_dict[ins][str_ltp]["Take"] = 0;
                        }
                        if (bid_pr < ltp && ltp === ask_pr) {
                            ice_dict[ins][str_ltp]["Hit"] = 0;
                        }
                        console.log("Checking here")
                        //Check Alert Code
                        const ask_q = ice_dict[ins][str_ltp]["Take"];
                        const bid_q = ice_dict[ins][str_ltp]["Hit"];

                        if (ask_q >= thres) {
                            const check_ls = [str_ltp, "Sell"];
                            if (!existing_ice[ins] || !existing_ice[ins].some(item => item[0] === str_ltp && item[1] === "Sell")) {
                                existing_ice[ins].push(check_ls);
                                const ice = [contr, ...check_ls, ask_q, ins];
                                mail1(ice);
                            }
                        }

                        if (bid_q >= thres) {
                            const check_ls = [str_ltp, "Buy"];
                            if (!existing_ice[ins] || !existing_ice[ins].some(item => item[0] === str_ltp && item[1] === "Buy")) {
                                existing_ice[ins].push(check_ls);
                                const ice = [contr, ...check_ls, bid_q, ins];
                                mail1(ice);
                            }
                        }

                    }
                })

                TASSubscription.setDataAdapter("HGTAS_Adapter");
                TASSubscription.setRequestedSnapshot("no");
                TASClient.subscribe(TASSubscription);
                TASClient.connect();
                // console.log("Subscribed to new instruments.");


                L1Subscription.setDataAdapter("HGL1_Adapter");
                L1Subscription.setRequestedSnapshot("no");
                L1Subscription.setRequestedMaxFrequency(1);
                L1Client.subscribe(L1Subscription);
                L1Client.connect();
                // console.log("Subscribed to new instruments.");
            }
        }

        const getStrategySubscriptions = async () => {
            console.log("Start getSubscriptions ", strategyMap);
            subs.clear();
            // const response = await fetch("http://localhost:8000/getSubscriptions");
            const response = await fetch("http://hydalert.dev.hertshtengroup.com/api/getSubscriptions");
            const data = await response.json();
            let datas = data.subscriptions;
            datas
                .filter(
                    (strategy) =>
                        (strategy.alertType === "bidStrategyAlert" || strategy.alertType === "askStrategyAlert") && strategy.status === 'active'
                )
                .forEach((strategy) => {
                    let threshold = strategy.threshold;
                    let alertID = strategy._id;
                    let alertName = strategy.alertName
                    let alertType = strategy.alertType 

                    const mp = new Map();
                    let instruments = [];
                    let details = strategy.details;
                    for (let i = 0; i < details.length; i++) {
                        let temp = "TT-" + details[i].selectedContract;
                        instruments.push(temp);
                        mp.set(temp, details[i].mult);
                    }

                    let runningMp = new Map();
                    mp.forEach((value, key) => {
                        runningMp.set(key, new Array(2).fill(0));
                    });

                    let totalIDs = runningMp.size;
                    let flagMp = new Map();

                    const subscription = new Subscription("MERGE", instruments, fields);
                    subs.set(alertID, ({ subscription, mp, threshold, runningMp, totalIDs, flagMp, alertID, alertName, alertType }));
                    subscription.setDataAdapter("HGL1_Adapter");
                    subscription.setRequestedSnapshot("no");
                    subscription.setRequestedMaxFrequency(1);
                });
        };


        const strategyAlert = async () => {
            await getStrategySubscriptions();
            strategyMap.forEach((subscription, alertID) => {
                strategyClient.unsubscribe(subscription);
                strategyMap.delete(alertID)
            });
            subs.forEach((sub, aID) => {
                let { subscription, mp, threshold, runningMp, totalIDs, flagMp, alertID , alertName , alertType } = sub;

                strategyClient.subscribe(subscription)
                strategyMap.set(alertID, subscription);


                subscription.addListener({
                    onItemUpdate: function (obj) {
                        let values = obj.updateValues;

                        let bestAsk = parseFloat(values[4]);
                        let bestBid = parseFloat(values[6]);

                        let currentId = values[2];

                        flagMp.set(currentId, '1');
                        runningMp.set(currentId, [bestAsk, bestBid]);


                        let askOfStructure = 0;
                        let bidOfStructure = 0;
                        runningMp.forEach((value, key) => {
                            let mult = parseFloat(mp.get(key));

                            if (mp.get(key)[0] === "-") {
                                bidOfStructure += (value[0] * mult);
                                askOfStructure += (value[1] * mult);
                            } else {
                                bidOfStructure += (value[1] * mult);
                                askOfStructure += (value[0] * mult);
                            }
                        });

                        if (flagMp.size === totalIDs) {
                            console.log("BID OF STRUCTURE : ", bidOfStructure, " alertID : ", alertID);
                            console.log("ASK OF STRUCTURE : ", askOfStructure, " alertID : ", alertID);
                            let comp = threshold.split(" ")[0];
                            let thresh = parseFloat(threshold.split(" ")[1]);

                            if(alertType === "bidStrategyAlert" && eval(`${bidOfStructure} ${comp} ${thresh}`)){
                                // console.log("ALERT ID " , alertID)
                                updateStatusofStrategyAlert(alertID , alertName , alertType)
                                console.log("bidOfStructure BREACHED !! Threshold Value: ", thresh);

                                strategyClient.unsubscribe(strategyMap.get(alertID));
                                subs.delete(alertID)
                                strategyMap.delete(alertID);

                            }

                            else if(alertType === "askStrategyAlert" && eval(`${askOfStructure} ${comp} ${thresh}`)){
                                updateStatusofStrategyAlert(alertID , alertName , alertType)
                                console.log("askOfStructure BREACHED !! Threshold Value: ", thresh);

                                strategyClient.unsubscribe(strategyMap.get(alertID));
                                subs.delete(alertID)
                                strategyMap.delete(alertID);
                            }
                        }
                    }
                })
            });
        };

        setInterval(getSubscriptions, 1000);
        setInterval(strategyAlert, 2000)
    </script>
